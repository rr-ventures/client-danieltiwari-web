[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Daily nurture drip (Model B): sends each enrolled lead's next due email from
# the current repo copy. Runs at 00:00 UTC.
[functions."nurture-drip"]
  schedule = "@daily"

[[redirects]]
  from = "/api/assessment-submit"
  to = "/.netlify/functions/assessment-submit"
  status = 200

[[redirects]]
  from = "/api/newsletter-submit"
  to = "/.netlify/functions/newsletter-submit"
  status = 200

[[redirects]]
  from = "/api/result-data"
  to = "/.netlify/functions/result-data"
  status = 200

[[redirects]]
  from = "/api/assessment-start"
  to = "/.netlify/functions/assessment-start"
  status = 200

[[redirects]]
  from = "/api/result-login"
  to = "/.netlify/functions/result-login"
  status = 200

[[redirects]]
  from = "/api/result-admin"
  to = "/.netlify/functions/result-admin"
  status = 200

# Daniel's private workspace for writing each person's result.
[[redirects]]
  from = "/results"
  to = "/results-admin.html"
  status = 200

# Hosted Assessment result, short shareable id, rendered client-side by result.html.
[[redirects]]
  from = "/r/*"
  to = "/result.html"
  status = 200

# Old V2 pages folded into the single-page direction, send them home.
[[redirects]]
  from = "/about.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/apply.html"
  to = "/"
  status = 301
  force = true

# The pretty-URL forms of the same two old pages. Without these, /about and
# /apply still served the retired V2 pages while /about.html and /apply.html
# correctly went home.
[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/apply"
  to = "/"
  status = 301
  force = true

# Daniel put the gate back 2026-09-13: /assessment now redirects here only if the
# visitor's browser has a preview_access cookie. Without it, an in-page script on
# assessment.html sends them to assessment-coming-soon.html, where the password
# (or a one-click ?key= link) sets the cookie and lets them through.
[[redirects]]
  from = "/assessment"
  to = "/assessment.html"
  status = 200

[[redirects]]
  from = "/api/bug-report"
  to = "/.netlify/functions/bug-report"
  status = 200

# Working/scratch files, never publicly reachable.
[[redirects]]
  from = "/style-picker.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/homepage-direction-v1.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Assessment + 404 keep their own per-page noindex meta tags; the homepage is indexable.
