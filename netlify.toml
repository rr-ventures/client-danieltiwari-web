[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Daily nurture drip (Model B): sends each enrolled lead's next due email from
# the current repo copy. Runs at 00:00 UTC.
[functions."nurture-drip"]
  schedule = "@daily"

[[redirects]]
  from = "/api/assessment-submit"
  to = "/.netlify/functions/assessment-submit"
  status = 200

[[redirects]]
  from = "/api/newsletter-submit"
  to = "/.netlify/functions/newsletter-submit"
  status = 200

[[redirects]]
  from = "/api/result-data"
  to = "/.netlify/functions/result-data"
  status = 200

[[redirects]]
  from = "/api/assessment-start"
  to = "/.netlify/functions/assessment-start"
  status = 200

[[redirects]]
  from = "/api/result-login"
  to = "/.netlify/functions/result-login"
  status = 200

[[redirects]]
  from = "/api/result-admin"
  to = "/.netlify/functions/result-admin"
  status = 200

# Daniel's private workspace for writing each person's result.
[[redirects]]
  from = "/results"
  to = "/results-admin.html"
  status = 200

# Hosted Assessment result, short shareable id, rendered client-side by result.html.
[[redirects]]
  from = "/r/*"
  to = "/result.html"
  status = 200

# Old V2 pages folded into the single-page direction, send them home.
[[redirects]]
  from = "/about.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/apply.html"
  to = "/#enquire"
  status = 301
  force = true

# The assessment is OPEN to everyone (Reece 2026-09-12, second gate removed 13 Sep).
# There is no cookie, no tester key and no coming-soon page: that page was deleted so
# nothing in this repo can suggest the assessment is shut. The page keeps its own
# noindex, so it is reachable by link without turning up in search.
[[redirects]]
  from = "/assessment"
  to = "/assessment.html"
  status = 200

[[redirects]]
  from = "/api/bug-report"
  to = "/.netlify/functions/bug-report"
  status = 200

# Working/scratch files, never publicly reachable.
[[redirects]]
  from = "/style-picker.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/homepage-direction-v1.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Assessment + 404 keep their own per-page noindex meta tags; the homepage is indexable.
